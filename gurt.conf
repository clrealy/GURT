# /etc/gurt.conf — system-wide gurt settings
# per-user overrides go in ~/.config/gurt/gurt.conf, env vars beat both.

# where recipes come from (point at a fork or a mirror if you want)
#GURT_REPO_URL="https://github.com/clrealy/GURT.git"
#GURT_BRANCH="main"

# where packages install. /usr/local keeps gurt away from your distro's own files.
#GURT_PREFIX="/usr/local"

# build flags
#MAKEFLAGS="-j$(nproc)"
#CFLAGS="-O2 -pipe"
#CXXFLAGS="-O2 -pipe"

# ── foreign sources ──────────────────────────────────────────────
# gurt can install packages from OTHER distros' repos on any distro:
#   gurt install aur/yay  apt/htop  dnf/htop  zypper/htop  pacman/htop
# point these at whatever mirror / release you want.

#AUR_URL="https://aur.archlinux.org"

# apt = Debian by default. for Ubuntu instead:
#   APT_MIRROR="http://archive.ubuntu.com/ubuntu" APT_SUITE="noble" APT_COMPONENTS="main universe"
#APT_MIRROR="https://deb.debian.org/debian"
#APT_SUITE="stable"
#APT_COMPONENTS="main contrib"

# $arch gets swapped for your CPU arch (x86_64, aarch64…)
#DNF_MIRROR="https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/$arch/os"
#ZYPPER_MIRROR="https://download.opensuse.org/tumbleweed/repo/oss"

#PACMAN_MIRROR="https://geo.mirror.pkgbuild.com"
#PACMAN_REPOS="core extra"

# how old (seconds) a foreign package index can get before gurt re-downloads it
#IDX_MAX_AGE=86400
