name: gurt ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: shellcheck gurt
        run: shellcheck -S warning gurt install.sh tools/lint.sh
      - name: lint recipes
        run: ./tools/lint.sh

  # the GURTSetupWizard installers build, and the .deb really installs (this runner is Ubuntu)
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis zstd openssl python3 desktop-file-utils
      - name: build every GURTSetupWizard
        run: |
          shellcheck -S warning tools/make-setup-wizard.sh tools/win/build-exe.sh
          tools/make-setup-wizard.sh dist --no-sign
          tools/win/build-exe.sh dist
          ls -la dist
          file dist/GURTSetupWizard.exe | grep -q 'PE32 executable'
      - name: install GURTSetupWizard.deb like a double-click would
        run: |
          sudo apt-get install -y ./dist/GURTSetupWizard.deb
          [ "$(gurt version)" = "gurt $(sed -n 's/^GURT_VERSION="\(.*\)"/\1/p' gurt)" ]
          desktop-file-validate /usr/share/applications/gurt.desktop /etc/xdg/autostart/gurt-setup-wizard.desktop
          mkdir -p ~/.config/gurt && echo '{"wizard": "done"}' > ~/.config/gurt/gui.json && timeout 20 gurt gui --first-run
          sudo apt-get remove -y gurt && ! command -v gurt

  # the dev build: install dev build 1 from the gurt-dev repo, publish dev build 2, and the distro's own update picks it up
  dev-rpm:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { distro: ["fedora:latest", "opensuse/tumbleweed"] }
    container: ${{ matrix.distro }}
    steps:
      - name: tools
        run: if command -v dnf; then dnf install -y git tar gzip python3 zstd gnupg2 findutils; else zypper -n install git tar gzip python3 zstd gpg2 findutils; fi
      - uses: actions/checkout@v4
      - name: dev build 1 → install → dev build 2 → update
        shell: bash
        run: |
          r=/tmp/devrepo; mkdir -p $r
          tools/make-setup-wizard.sh $r --dev=1 --no-sign && ./gurt -y repo publish $r gurt-dev
          rpm -qlp $r/GURTSetupWizard-dev.rpm | grep -q /etc/zypp/repos.d/gurt-dev.repo
          if command -v dnf >/dev/null; then dnf install -y $r/GURTSetupWizard-dev.rpm; else zypper -n --no-gpg-checks install $r/GURTSetupWizard-dev.rpm; fi
          [ "$(gurt version)" = "gurt $(sed -n 's/^GURT_VERSION="\(.*\)"/\1/p' gurt)+dev.1" ]
          # point the installed repo at this test repo instead of the website, then publish build 2
          sed -i "s|^baseurl=.*|baseurl=file://$r|" /etc/yum.repos.d/gurt-dev.repo /etc/zypp/repos.d/gurt-dev.repo
          rm -f $r/*.rpm; tools/make-setup-wizard.sh $r --dev=2 --no-sign && ./gurt -y repo publish $r gurt-dev
          if command -v dnf >/dev/null; then dnf upgrade -y --refresh gurt; else zypper -n --gpg-auto-import-keys refresh gurt-dev && zypper -n up gurt; fi
          rpm -q gurt | tee /tmp/q.txt; grep -q '+dev.2' /tmp/q.txt
          [ "$(gurt version)" = "gurt $(sed -n 's/^GURT_VERSION="\(.*\)"/\1/p' gurt)+dev.2" ]

  # gurt on Windows: the PowerShell installer has to parse + pass PSScriptAnalyzer on a real Windows box
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 parses + passes PSScriptAnalyzer
        shell: pwsh
        run: |
          $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { Write-Host "::error file=install.ps1::$_" }; exit 1 }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($r) { exit 1 }
          Write-Host "install.ps1 ✅"

  # builds every recipe the PR touched, on a few different distros
  build:
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian:stable, fedora:latest, archlinux:latest, alpine:latest, opensuse/tumbleweed]
    container: ${{ matrix.distro }}
    steps:
      - name: bootstrap
        run: |
          if command -v apt-get; then apt-get update && apt-get install -y git bash sudo curl gnupg gpgv xz-utils binutils zstd python3
          elif command -v dnf; then dnf install -y git bash sudo tar gzip findutils gnupg2 xz bsdtar zstd python3
          elif command -v pacman; then pacman -Syu --noconfirm git bash sudo gnupg xz libarchive zstd python
          elif command -v apk; then apk add git bash sudo curl tar coreutils findutils gnupg gpgv xz binutils zstd python3
          elif command -v zypper; then zypper -n install git bash sudo curl tar gzip findutils gpg2 xz bsdtar zstd python3; fi
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gurt utils installs everything on this distro
        shell: bash
        run: |
          ./gurt -y utils
          ./gurt utils list | tee /tmp/utils.txt
          ! grep -q '✗' /tmp/utils.txt
      - name: gurt convert makes a package this distro's own package manager installs
        shell: bash
        run: |
          mkdir -p /tmp/cv/gurt-cvtest-1.0/usr/bin
          printf '#!/bin/sh\necho converted by gurt\n' > /tmp/cv/gurt-cvtest-1.0/usr/bin/gurt-cvtest; chmod 755 /tmp/cv/gurt-cvtest-1.0/usr/bin/gurt-cvtest
          tar -czf /tmp/cv/gurt-cvtest-1.0.tar.gz -C /tmp/cv gurt-cvtest-1.0
          cd /tmp/cv
          # converted packages come out signed: trust the key, then install with each distro's signature checks ON
          g="$GITHUB_WORKSPACE/gurt"
          if command -v apt-get; then "$g" -y convert gurt-cvtest-1.0.tar.gz deb && grep -qa _gpgorigin ./gurt-cvtest_*.deb && dpkg -i ./gurt-cvtest_*.deb
          elif command -v dnf; then "$g" -y convert gurt-cvtest-1.0.tar.gz rpm && "$g" -y key trust && rpm -Kv ./gurt-cvtest-*.rpm | tee /tmp/k.txt &&
            grep -q 'Header V4 RSA/SHA256 Signature, key ID .*: OK' /tmp/k.txt && dnf install -y ./gurt-cvtest-*.rpm
          elif command -v pacman; then "$g" -y convert gurt-cvtest-1.0.tar.gz pacman && [ -f ./gurt-cvtest-*.pkg.tar.zst.sig ] && "$g" -y key trust &&
            pacman -U --noconfirm ./gurt-cvtest-*.pkg.tar.zst
          elif command -v apk; then "$g" -y convert gurt-cvtest-1.0.tar.gz apk && "$g" -y key trust && apk verify ./gurt-cvtest-*.apk && apk add ./gurt-cvtest-*.apk
          elif command -v zypper; then "$g" -y convert gurt-cvtest-1.0.tar.gz rpm && "$g" -y key trust && rpm -K ./gurt-cvtest-*.rpm &&
            zypper --non-interactive install ./gurt-cvtest-*.rpm; fi
          [ "$(gurt-cvtest)" = "converted by gurt" ]
          # Arch: a signed pacman repo from gurt repo publish, installed by real pacman with signatures required
          if command -v pacman >/dev/null; then
            mkdir -p /tmp/cv/prepo && cp ./gurt-cvtest-*.pkg.tar.zst /tmp/cv/prepo/
            "$g" repo publish /tmp/cv/prepo cvpac
            printf '\n[cvpac]\nSigLevel = Required\nServer = file:///tmp/cv/prepo\n' >> /etc/pacman.conf
            pacman -Sy --noconfirm
            pacman -S --noconfirm cvpac/gurt-cvtest
            pacman -Qi gurt-cvtest | tee /tmp/qi.txt
            grep -q 'Validated By.*Signature' /tmp/qi.txt
          fi
          # every other format gets a signature that checks out too
          "$g" -y key export /tmp/cv/pub && gpg --dearmor < /tmp/cv/pub/gurt-key.asc > /tmp/cv/k.gpg
          "$g" -y convert gurt-cvtest-1.0.tar.gz zip && gpgv --keyring /tmp/cv/k.gpg ./gurt-cvtest-1.0.zip.asc ./gurt-cvtest-1.0.zip
          "$g" verify ./gurt-cvtest-1.0.zip
          # a signed repo from what we converted: publish it, add it, install from it
          mkdir -p /tmp/cv/repo && cp ./gurt-cvtest*.deb ./gurt-cvtest*.rpm /tmp/cv/repo/ 2>/dev/null || "$g" -y convert gurt-cvtest-1.0.tar.gz deb -o /tmp/cv/repo
          "$g" repo publish /tmp/cv/repo cvrepo
          if command -v apt-get >/dev/null; then "$g" -y repo add cvrepo apt file:///tmp/cv/repo stable main --key /tmp/cv/repo/gurt-key.asc && "$g" search cvrepo/gurt-cvtest; fi
          "$g" -y convert gurt-cvtest-1.0.tar.gz gurt && gpgv --keyring /tmp/cv/k.gpg ./gurt-cvtest-*.gurt.asc ./gurt-cvtest-*.gurt
      - name: build changed packages
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- packages | cut -d/ -f2 | sort -u)
          [ -z "$changed" ] && { echo "no recipes changed"; exit 0; }
          export GURT_ALLOW_ROOT=1 GURT_REPO_DIR="$PWD" GURT_ROOT=/tmp/gurtroot
          for p in $changed; do
            [ -d packages/$p ] || continue
            if grep -q '^via_type=flatpak' packages/$p/GURTBUILD; then
              # a Flathub app: check its id really exists (downloading every app + runtime on 5 distros would fill the runner).
              # the first one sets up flatpak through gurt, then one Flathub listing checks the rest fast
              id=$(sed -n 's/^via_pkg=//p' packages/$p/GURTBUILD)
              if [ ! -s /tmp/flathub-ids.txt ]; then
                ./gurt -y info "flatpak/$id" >/dev/null || { echo "::error::$p: $id isn't on Flathub"; exit 1; }
                flatpak remote-ls --user --app flathub --columns=application > /tmp/flathub-ids.txt
              fi
              grep -qxF "$id" /tmp/flathub-ids.txt || { echo "::error::$p: $id isn't on Flathub"; exit 1; }
              echo "✅ $p → $id is on Flathub"
            elif grep -q '^secret=true' packages/$p/GURTBUILD; then
              # secret packages only answer to their alias
              ./gurt -y install "$(./gurt srcinfo packages/$p | sed -n 's/^alias = //p' | head -n1)"
            else
              ./gurt -y install "$p"
              # lots of recipes in one PR: clean up as we go so the runner's disk doesn't fill up
              ./gurt -y remove "$p" >/dev/null 2>&1 || true
              rm -rf "${GURT_CACHE:-$HOME/.cache/gurt}/sources" "${GURT_CACHE:-$HOME/.cache/gurt}/pkg"
            fi
          done

  # recipes uploaded from the website don't have .gurtinfo — generate/refresh them on main
  srcinfo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: regenerate .gurtinfo + CODEOWNERS
        run: |
          for d in packages/*/ dirt/*/; do if [ -d "$d" ]; then ./gurt srcinfo "$d" > "$d/.gurtinfo"; fi; done
          ./tools/gen-codeowners.sh
          if [ -n "$(git status --porcelain packages .github/CODEOWNERS)" ]; then
            git config user.name "gurt-bot"
            git config user.email "gurt-bot@users.noreply.github.com"
            git add packages .github/CODEOWNERS
            git commit -m "bot: regenerate .gurtinfo + CODEOWNERS 🦆"
            git push
          fi

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: for d in packages/*/ dirt/*/; do if [ -d "$d" ]; then ./gurt srcinfo "$d" > "$d/.gurtinfo"; fi; done
      - run: python3 tools/gen-index.py
      - name: serve the installer + script from the site too
        run: cp install.sh gurt deps.map vibes.map site/
      # 🧪 the dev build: GURTSetupWizard-dev.rpm + an rpm repo at /dev/rpm, rebuilt on every push to main.
      # the dev rpm adds that repo to zypper / dnf, so zypper up / dnf upgrade bring each new dev build
      - name: signing key (same GURT_SIGNING_KEY secret as releases; without it the dev repo is unsigned)
        env: { KEY: "${{ secrets.GURT_SIGNING_KEY }}" }
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p "$HOME/.local/share/gurt" && echo "$KEY" | base64 -d | tar xzf - -C "$HOME/.local/share/gurt"
            chmod -R go-rwx "$HOME/.local/share/gurt/signing"; echo "SIGN=" >> "$GITHUB_ENV"
          else echo "SIGN=--no-sign" >> "$GITHUB_ENV"; fi
      - name: GURTSetupWizard-dev.rpm + the gurt-dev repo
        run: |
          sudo apt-get install -y -qq zstd gnupg python3 >/dev/null
          mkdir -p site/dev/rpm
          tools/make-setup-wizard.sh site/dev/rpm --dev=${{ github.run_number }} $SIGN
          ./gurt -y repo publish site/dev/rpm gurt-dev
          cp site/dev/rpm/GURTSetupWizard-dev.rpm site/dev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
