name: flathub recipes
# adds Flathub's most popular apps to Main GURT. Runs when tools/gen-flathub.request (a number) changes on a
# branch: makes that many new recipes, keeps only app ids Flathub really has, commits them to the branch.
on:
  push:
    branches-ignore: [main]
    paths: ["tools/gen-flathub.request"]
  workflow_dispatch:
    inputs:
      count: { description: "how many new Flathub apps", default: "100" }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq flatpak
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: generate recipes
        run: |
          set -o pipefail; : > /tmp/gen.log
          # the request file holds a number (how many new apps) and/or the word "recategorize"
          if grep -qs recategorize tools/gen-flathub.request; then python3 tools/gen-flathub.py recategorize | tee -a /tmp/gen.log; fi
          n="${{ github.event.inputs.count }}"; [ -n "$n" ] || n=$(tr -dc 0-9 < tools/gen-flathub.request || true)
          if [ -n "$n" ]; then python3 tools/gen-flathub.py "$n" | tee -a /tmp/gen.log; fi
      - name: keep only ids that are really on Flathub
        run: |
          flatpak remote-ls --user --app flathub --columns=application > /tmp/flathub-ids.txt
          echo "Flathub has $(wc -l < /tmp/flathub-ids.txt) apps"
          for d in $(git ls-files --others --exclude-standard packages | cut -d/ -f2 | sort -u); do
            id=$(sed -n 's/^via_pkg=//p' "packages/$d/GURTBUILD")
            grep -qxF "$id" /tmp/flathub-ids.txt || { echo "dropping $d ($id isn't on Flathub)"; rm -rf "packages/$d"; }
          done
          for d in $( { git ls-files --others --exclude-standard packages; git diff --name-only -- packages; } | cut -d/ -f2 | sort -u); do
            ./gurt srcinfo "packages/$d" > "packages/$d/.gurtinfo"
          done
          ./tools/lint.sh > /tmp/lint.log || { tail -20 /tmp/lint.log; exit 1; }
      - name: commit
        run: |
          git rm -q --ignore-unmatch tools/gen-flathub.request
          git add packages
          n=$(git diff --cached --name-only -- packages | grep -c '/GURTBUILD$' || true)
          msg="bot: $(grep -h 'added .* Flathub apps\|recategorized' /tmp/gen.log | paste -sd ', ' -) 🦆"
          git -c user.name="gurt bot" -c user.email="gurt-bot@users.noreply.github.com" commit -qm "$msg" || exit 0
          git push
