[package]
name = "gurt-app"
version = "1.4.1"
edition = "2021"
description = "GURT, the app: a native window for the gurt CLI"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard", "links"] }
egui_extras = { version = "0.37", default-features = false, features = ["file", "http", "image", "svg"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
